
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CITY SAATHI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6fb;
  color: #222;
}

header {
  background: #0759a5;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  font-size: 29px;
  letter-spacing: 1px;
}

header p {
  margin-top: 7px;
}

.search {
  padding: 18px 15px;
}

.search input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}

.container {
  padding: 10px 15px 25px;
}

h2 {
  margin: 15px 0;
  font-size: 20px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: white;
  padding: 20px 10px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 8px #00000010;
}

.card .emoji {
  font-size: 30px;
  margin-bottom: 9px;
}

.card h3 {
  font-size: 16px;
  color: #0759a5;
}

.welcome {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
  line-height: 1.6;
}

footer {
  background: #0759a5;
  color: white;
  text-align: center;
  padding: 18px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>🏙️ CITY SAATHI</h1>
  <p>आपके शहर का अपना साथी</p>
</header>

<div class="search">
  <input
    type="search"
    id="search"
    placeholder="अपने शहर में कुछ खोजें..."
    oninput="searchItems()"
  >
</div>

<div class="container">

  <h2>हमारी सेवाएँ</h2>

  <div class="categories" id="categories">

    <div class="card">
      <div class="emoji">🏪</div>
      <h3>दुकानें</h3>
    </div>

    <div class="card">
      <div class="emoji">💼</div>
      <h3>नौकरी</h3>
    </div>

    <div class="card">
      <div class="emoji">🏠</div>
      <h3>मकान किराया</h3>
    </div>

    <div class="card">
      <div class="emoji">🔧</div>
      <h3>स्थानीय सेवाएँ</h3>
    </div>

    <div class="card">
      <div class="emoji">📰</div>
      <h3>शहर की खबरें</h3>
    </div>

    <div class="card">
      <div class="emoji">🛍️</div>
      <h3>अपना बाजार</h3>
    </div>

  </div>

  <div class="welcome">
    <h2>स्वागत है CITY SAATHI में!</h2>
    <p>
      अब अपने शहर की दुकानें, नौकरी,
      मकान और जरूरी सेवाएँ एक ही जगह
      पर आसानी से खोजें।
    </p>
  </div>

</div>

<footer>
  <p>© 2026 CITY SAATHI</p>
  <p>आपके शहर का अपना साथी ❤️</p>
</footer>

<script>
function searchItems() {
  const value = document
    .getElementById("search")
    .value.toLowerCase();

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    const text = card.innerText.toLowerCase();

    card.style.display =
      text.includes(value) ? "block" : "none";
  });
}
</script>

</body>
</html>
